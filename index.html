<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

    <div class="display">
        <div id="expression">Ready</div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button>AC</button>
        <button>⌫</button>
        <button>÷</button>
        <button>×</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>−</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>=</button>

        <button class="zero">0</button>
        <button>.</button>
    </div>

    <div class="history">
        <div class="history-head">
            <h3>History</h3>
            <button id="clearHistory">Clear</button>
        </div>
        <div id="historyList"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>

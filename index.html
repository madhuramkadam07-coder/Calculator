<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <h2>Calculator</h2>

    <div class="display">
      <div id="expression"></div>
      <div id="result">0</div>
    </div>

    <div class="buttons">
      <button onclick="clearAll()" class="special">AC</button>
      <button onclick="del()" class="special">DEL</button>
      <button onclick="add('%')" class="special">%</button>
      <button onclick="add('/')" class="operator">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('*')" class="operator">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('-')" class="operator">−</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('+')" class="operator">+</button>

      <button onclick="add('0')" class="zero">0</button>
      <button onclick="add('.')">.</button>
      <button onclick="calculate()" class="equal">=</button>
    </div>

    <div class="history">
      <div class="history-title">
        <h3>History</h3>
        <button onclick="clearHistory()">Clear</button>
      </div>
      <div id="historyList">No history</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
